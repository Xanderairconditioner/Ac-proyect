<!doctype html>
<html lang="es-PR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#061a31">
  <title>Página no encontrada | Xander Air Conditioner</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #041324; color: #f7fbff; font-family: 'Segoe UI', system-ui, sans-serif; }
    .page { min-height: 100svh; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 38%, #103b5e 0%, #061a31 42%, #041324 85%); }
    header { width: min(1100px, calc(100% - 48px)); margin: auto auto 0; padding: 23px 0; border-bottom: 1px solid #ffffff1f; }
    .brand { display: block; width: 220px; height: 125px; object-fit: contain; }
    main { width: min(600px, calc(100% - 48px)); margin: auto; padding: 46px 0 56px; text-align: center; }
    .code { margin: 0; font-size: clamp(100px, 27vw, 170px); line-height: .9; letter-spacing: -.075em; font-weight: 800; color: #36aaf5; text-shadow: 0 10px 70px #168be04a; }
    .eyebrow { margin: 20px 0 15px; color: #8acbfa; font-size: 11px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 43px); letter-spacing: -.045em; line-height: 1.13; }
    .description { margin: 18px auto 27px; max-width: 430px; color: #b7c9d8; font-size: 16px; line-height: 1.65; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .button { display: inline-flex; min-height: 50px; align-items: center; justify-content: center; padding: 0 21px; border: 1px solid #fff4; border-radius: 5px; color: white; text-decoration: none; font-size: 14px; font-weight: 700; }
    .primary { border-color: #168be0; background: #0879c8; }
    .button:hover { filter: brightness(1.16); }
    a:focus-visible { outline: 3px solid #9bddff; outline-offset: 4px; }
    footer { width: min(1100px, calc(100% - 48px)); margin: 0 auto; padding: 19px 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-top: 1px solid #ffffff1f; color: #9fb4c6; font-size: 11px; }
    .credit { display: flex; align-items: center; gap: 8px; color: #b8cad8; text-decoration: none; }
    .credit img { display: block; width: 118px; height: 36px; object-fit: contain; }
    @media (max-width: 600px) { header { padding: 5px 0; } .brand { width: 210px; height: 116px; } main { padding: 42px 0; } footer { flex-direction: column; justify-content: center; text-align: center; } }
  </style>
</head>
<body>
  <div class="page">
    <header><a href="/" aria-label="Xander Air Conditioner, ir al inicio"><img class="brand" src="/assets/logo-transparent.png" alt="Xander Air Conditioner"></a></header>
    <main>
      <p class="code" aria-label="Error 404">404</p>
      <p class="eyebrow">Página no encontrada</p>
      <h1>Esta página tomó otro rumbo.</h1>
      <p class="description">No encontramos la página que buscas, pero podemos ayudarte a regresar al lugar correcto.</p>
      <div class="actions"><a class="button primary" href="/">Volver al inicio <span aria-hidden="true">&nbsp; →</span></a><a class="button" href="tel:+17874016446">Llamar a Xander</a></div>
    </main>
    <footer><span>© Xander Air Conditioner · Puerto Rico</span><a class="credit" href="https://rosadomediagroup.com/" aria-label="Sitio creado por Rosado Media Group"><span>Sitio creado por</span><img src="/assets/rosado-media-group-logo-transparent.png" alt="Rosado Media Group"></a></footer>
  </div>
</body>
</html>
